<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Modal Example</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class=" py-5 row">
        <div class="container mt-5 col-md-6 offset-md-3">
            <div class="card p-4 shadow-sm">
                <h3 class="mb-3">Welcome to the page!</h3>

                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your name">
                </div>

                <button class="btn btn-primary" onclick="showGreeting()">
                    Submit
                </button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="helloModal" tabindex="-1" aria-labelledby="helloModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="helloModalLabel">Greeting</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body" id="greetingText">
                    Hello!
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function showGreeting() {
            const name = document.getElementById("name").value.trim();

            document.getElementById("greetingText").innerText =
                name ? `Hello, ${name}!` : "Hello!";

            const modal = new bootstrap.Modal(document.getElementById("helloModal"));
            modal.show();
        }
        window.onload = function () {
            document.body.style.backgroundColor = 'black';
        };

    </script>


</body>

</html>
